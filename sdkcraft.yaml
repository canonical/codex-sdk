name: codex
title: OpenAI Codex SDK
adopt-info: codex
summary: OpenAI Codex CLI agent
description: |
  This SDK provides the OpenAI Codex CLI for AI-assisted coding within a
  workshop. The agent is sandboxed in the workshop container. Credentials are
  persisted between workshop updates.
license: https://openai.com/policies/row-terms-of-use/
build-base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

plugs:
  codex-config:
    interface: mount
    workshop-target: /home/workshop/.codex

parts:
  codex:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
      - jq
    override-pull: |
      VERSION="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      craftctl set version="$VERSION"
      TAG="rust-v${VERSION}"
      ASSET="codex-x86_64-unknown-linux-musl.tar.gz"
      API_URL="https://api.github.com/repos/openai/codex/releases/tags/${TAG}"
      DOWNLOAD_URL="https://github.com/openai/codex/releases/download/${TAG}/${ASSET}"

      echo "Fetching release metadata for ${TAG}..."
      RELEASE_JSON="$(curl -fsSL \
        -H "Accept: application/vnd.github+json" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        "${API_URL}")"

      DIGEST="$(echo "$RELEASE_JSON" | jq -r ".assets[] | select(.name == \"${ASSET}\") | .digest")"
      CHECKSUM="${DIGEST#sha256:}"

      if ! echo "$CHECKSUM" | grep -qE '^[a-f0-9]{64}$'; then
        echo "Invalid or missing checksum for ${ASSET} in ${TAG}" >&2
        exit 1
      fi

      echo "Downloading ${DOWNLOAD_URL}..."
      curl -fsSL -o "$CRAFT_PART_SRC/${ASSET}" "${DOWNLOAD_URL}"

      ACTUAL="$(sha256sum "$CRAFT_PART_SRC/${ASSET}" | cut -d' ' -f1)"
      if [ "$ACTUAL" != "$CHECKSUM" ]; then
        echo "Checksum mismatch!" >&2
        echo "  expected: $CHECKSUM" >&2
        echo "  actual:   $ACTUAL" >&2
        rm -f "$CRAFT_PART_SRC/${ASSET}"
        exit 1
      fi
      echo "Checksum OK."

      tar -xzf "$CRAFT_PART_SRC/${ASSET}" -C "$CRAFT_PART_SRC"
      mv "$CRAFT_PART_SRC/codex-x86_64-unknown-linux-musl" "$CRAFT_PART_SRC/codex"
      chmod 755 "$CRAFT_PART_SRC/codex"
      rm -f "$CRAFT_PART_SRC/${ASSET}"
    override-build: |
      install -Dm755 "$CRAFT_PART_SRC/codex" "$CRAFT_PRIME/bin/codex"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
