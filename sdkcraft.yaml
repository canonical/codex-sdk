name: codex
title: OpenAI Codex SDK
adopt-info: codex
summary: OpenAI Codex CLI agent
description: |
  This SDK provides the OpenAI Codex CLI for AI-assisted coding within a
  workshop. The agent is sandboxed in the workshop container. Credentials are
  persisted between workshop updates.
license: https://openai.com/policies/row-terms-of-use/
build-base: ubuntu@24.04
platforms:
  amd64:
  arm64:

plugs:
  codex-config:
    interface: mount
    workshop-target: /home/workshop/.codex

parts:
  codex:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-pull: |
      VERSION="$(cat "$CRAFT_PROJECT_DIR/VERSION")"
      craftctl set version="$VERSION"

      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64) ARCH=x86_64  ;;
        arm64) ARCH=aarch64 ;;
        *) echo "Unsupported arch: ${CRAFT_ARCH_BUILD_FOR}" >&2; exit 1 ;;
      esac
      ASSET="codex-${ARCH}-unknown-linux-musl.tar.gz"
      DOWNLOAD_URL="https://github.com/openai/codex/releases/download/rust-v${VERSION}/${ASSET}"

      CHECKSUM="$(awk -v key="$ASSET" '$2 == key {print $1}' "$CRAFT_PROJECT_DIR/CHECKSUMS")"
      if ! echo "$CHECKSUM" | grep -qE '^[a-f0-9]{64}$'; then
        echo "Invalid or missing checksum for ${ASSET} in CHECKSUMS" >&2
        exit 1
      fi

      echo "Downloading ${DOWNLOAD_URL}..."
      curl -fsSL -o "$CRAFT_PART_SRC/${ASSET}" "${DOWNLOAD_URL}"

      ACTUAL="$(sha256sum "$CRAFT_PART_SRC/${ASSET}" | cut -d' ' -f1)"
      if [ "$ACTUAL" != "$CHECKSUM" ]; then
        echo "Checksum mismatch!" >&2
        echo "  expected: $CHECKSUM" >&2
        echo "  actual:   $ACTUAL" >&2
        rm -f "$CRAFT_PART_SRC/${ASSET}"
        exit 1
      fi

      echo "Checksum OK. Extracting..."
      tar -xzf "$CRAFT_PART_SRC/${ASSET}" -C "$CRAFT_PART_SRC"
      mv "$CRAFT_PART_SRC/codex-${ARCH}-unknown-linux-musl" "$CRAFT_PART_SRC/codex"
      rm -f "$CRAFT_PART_SRC/${ASSET}"
    override-build: |
      install -Dm755 "$CRAFT_PART_SRC/codex" "$CRAFT_PART_INSTALL/bin/codex"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
