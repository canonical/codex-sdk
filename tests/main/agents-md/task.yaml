summary: setup-project hook installs the workshop prompt as ~/.codex/AGENTS.md

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # setup-project installs the workshop prompt as ~/.codex/AGENTS.md, which
  # Codex reads natively as global user memory on every invocation.
  workshop exec -- test -f /home/workshop/.codex/AGENTS.md
  workshop exec -- head -1 /home/workshop/.codex/AGENTS.md | \
    MATCH "Workshop Container Environment Instructions"

debug: |
  workshop exec -- ls -la /home/workshop/.codex/ || true
  workshop exec -- cat /home/workshop/.codex/AGENTS.md || true
